<!DOCTYPE html>
  <head>
    <style>

      .header {
        display: flex;
        flex-direction: row;
        background-color: #7E5EB5;
        justify-content: space-between;
        font-family: arial;
        align-items: center;
        padding: 20px;
      }

      p {
        color: white;
        font-weight: 600;
      }

      input {
        border-radius: 50px;
        width: 600px;
        height: 16px;
        padding: 12px;
        border: none; 
        
      }

      button {
        border-radius: 4px;
        border: 1px solid white;
        background-color: #7E5EB5;
        color: white;
        width: 80px;
        height: 35px;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div>
        <p>
          Home
        </p>
      </div>
      <div>
        <input placeholder="Search">
      </div>
      <div>
        <button>
          Download
        </button>
      </div>
    </div>
  </body>
</html>
