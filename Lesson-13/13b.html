<!DOCTYPE html>
  <head>
    <style> 
    .holder {
      display: flex;
      flex-direction: row;
    }

    .element-1 {
      background-color: lightpink;
      width: 100px;
      height:100px; 
    }

    .element-2 {
      display: flex;
      flex-direction: column;
      align-items: left;
      justify-content: center;
      background-color: lightblue;
      width: 200px;
      height:100px; 
    }

    .sub-element-1 {
      display: flex;
      flex-direction: column;

    }

    .sub-element-2 {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
    }

    p {
      margin: 0;
    }

    .row2 {
      color: white;
      background-color: black;
    }

    </style>
  </head>
  <body>
    <div class="holder">
      <div class="element-1"></div>
      <div class="element-2">
        <div class="sub-element-1">
          <p>
            row1
          </p>
        </div>
        <div class="sub-element-2">
           <p class="row2">
            row2
          </p>
          <p class="row2">row2</p>
        </div>
      </div>
    </div>
  </body>
</html>
