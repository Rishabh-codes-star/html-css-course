<!DOCTYPE html>
  <head>
    <style>
      .holder {
        display: flex;
        flex-direction: column;
        gap: 20px;
        width: 420px;
        box-shadow: 00 00px 4px rgba(00,00,00,0.2);
        padding: 10px;
        padding-bottom: 20px;
        border-radius: 4px;
      }
      /* .element-1 {

      } */
      .element-2 {
        display: flex;
        flex-direction: row;
        /* justify-content: space-evenly; */
        align-items:flex-start;
        gap: 20px;
      }

      /* .sub-element-1 {} */
      .sub-element-2 {
        display: flex;
        flex-direction: column;
        gap: 20px;
        /* justify-content: space-between; */
      }
      .meta-data-1 {
        display: flex;
        flex-direction: row;
        justify-content: space-between;
      }
      .meta-data-2 {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      p {
        margin: 0;
        font-family: arial;
        color: black;
        font-weight: 700;
      }
      .title {
        font-size: 18px;
      }
      .tag {
        font-size: 16px;
      }
      .gray-elements {
        color: gray;
        font-weight: 500;
      }
      img {
        height: 60px;
        width: 60px;
        object-fit: cover;
        object-position: center;
        border-radius: 30px;
        border: none;
      }
    </style>
  </head>
  <body>
    <div class="holder">
      <div class="element-1"> 
        <p class="gray-elements">
          All IBOXES
        </p>
      </div>
      <div class="element-2">
        <img src="image-mesh-gradient (1).png">
        <div class="sub-element-1">
          <div class="meta-data-1">
            <p class="title">Chewy Promotions</p>
            <p class="gray-elements">4:58 PM</p>
          </div>
          <div class="meta-data-2">
            <p class="tag">Biggest sales of the year!</p>
            <p class="gray-elements">Hey there! We're writing to tell you about our...</p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
